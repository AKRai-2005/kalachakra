[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalachakra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy","torch","scikit-learn","xgboost","matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
